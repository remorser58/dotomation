name: Release dots.py

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest is 26.04, which has no Python 3.9 build for setup-python; 24.04 still has 3.9.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify release tag
        env:
          TAG: ${{ github.ref_name }}
          PYTHONPATH: tools
        run: |
          python3 - <<'PY'
          import os
          import re
          from dots import VERSION

          tag = os.environ["TAG"]
          if tag != f"v{VERSION}" or not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", VERSION):
              raise SystemExit(f"Tag {tag!r} must match the stable version v{VERSION}")
          PY
      - run: python3 -m unittest discover -s tools

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Publish release assets
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum tools/dots.py | sed 's#tools/##' > tools/dots.py.sha256
          # a re-run after a failed upload finds the release already there: create it only once,
          # then upload (or replace) both assets so the pair always matches this commit
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" tools/dots.py tools/dots.py.sha256 --clobber
